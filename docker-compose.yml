services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: undertow
      POSTGRES_PASSWORD: undertow
      POSTGRES_DB: undertow
    ports:
      - "5433:5432"
    volumes:
      - undertow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Workers run on the host: python -m app.worker

volumes:
  undertow_pg:
