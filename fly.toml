# fly.toml app configuration file generated for Undertow
# Secrets (SECRET_KEY, DATABASE_URL, REDIS_URL, API keys) via `fly secrets set` — never commit them.

app = "undertow"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Additional processes (worker + clock) should be separate Fly apps or [processes]
# using the same image:
#   web: uvicorn app.main:app --host 0.0.0.0 --port 8000
#   worker: python -m app.worker
#   clock: python -m app.clock
